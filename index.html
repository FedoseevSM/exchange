<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>EXCHANGE • Мгновенный обмен валют</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: radial-gradient(circle at 10% 20%, #0B0F1C, #05070F);
            min-height: 100vh;
            padding: 1.5rem;
            color: #EDF2FF;
        }

        /* Glass morphism container */
        #app {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(99, 102, 241, 0.2);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        /* Navigation — sleek & minimal */
        .nav-bar {
            background: rgba(5, 10, 20, 0.75);
            backdrop-filter: blur(20px);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            border-bottom: 1px solid rgba(99, 102, 241, 0.25);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #A5B4FC;
            font-size: 1.3rem;
            font-weight: 500;
            cursor: pointer;
            width: 2.4rem;
            height: 2.4rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.25s ease;
        }

        .back-btn:hover {
            background: #4F46E5;
            color: white;
            border-color: #4F46E5;
            transform: translateX(-2px);
        }

        .page-title {
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(135deg, #E0E7FF, #A5B4FC);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        /* ----- CARDS / TABLE MODERN ----- */
        .table-container {
            padding: 1.8rem;
        }

        /* Desktop table — futuristic */
        .pairs-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: rgba(10, 15, 30, 0.5);
            border-radius: 1.5rem;
            overflow: hidden;
            backdrop-filter: blur(4px);
        }

        .pairs-table th {
            background: rgba(30, 41, 59, 0.7);
            color: #C7D2FE;
            font-weight: 500;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 1rem 1.2rem;
            border-bottom: 1px solid rgba(99, 102, 241, 0.3);
        }

        .pairs-table td {
            padding: 1rem 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #E2E8F0;
            font-weight: 450;
        }

        .pairs-table tbody tr {
            transition: all 0.2s;
            cursor: pointer;
        }

        .pairs-table tbody tr:hover {
            background: rgba(79, 70, 229, 0.2);
            transform: scale(1.01);
        }

        .pair-symbol {
            font-weight: 700;
            font-size: 1rem;
            color: #F0F3FF;
            letter-spacing: -0.2px;
        }

        .rate-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            background: linear-gradient(145deg, #FDE047, #FACC15);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            font-size: 0.9rem;
        }

        .badge-market {
            background: rgba(79, 70, 229, 0.2);
            border-radius: 30px;
            padding: 0.2rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: #A5B4FC;
            backdrop-filter: blur(2px);
            white-space: nowrap;
        }

        /* MOBILE CARDS (modern) */
        .mobile-cards-container {
            display: none;
            flex-direction: column;
            gap: 1rem;
        }

        .mobile-pair-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 1.5rem;
            padding: 1rem 1.2rem;
            transition: all 0.2s;
            cursor: pointer;
        }

        .mobile-pair-card:active {
            background: rgba(79, 70, 229, 0.2);
            transform: scale(0.98);
        }

        .mobile-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
        }

        .mobile-pair-symbol {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(145deg, #FFF, #A5B4FC);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .mobile-rate-badge {
            background: #1E293B;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #FACC15;
        }

        /* Balance footer */
        .balance-footer {
            background: rgba(0, 0, 0, 0.4);
            margin-top: 1.5rem;
            padding: 0.8rem 1.2rem;
            border-radius: 1.2rem;
            font-size: 0.7rem;
            text-align: center;
            backdrop-filter: blur(4px);
            color: #94A3B8;
            border: 1px dashed rgba(255,255,255,0.1);
        }

        /* ---------- EXCHANGE PAGE (MODERN DARK) ---------- */
        .exchange-detail {
            padding: 1.8rem;
        }

        .exchange-header {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.8));
            border-radius: 1.8rem;
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 1.8rem;
            border: 1px solid rgba(99, 102, 241, 0.4);
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.4);
        }

        .pair-big {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(145deg, #FFE4B5, #FFB347);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .live-rate {
            margin-top: 0.6rem;
            background: rgba(0, 0, 0, 0.4);
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #CBD5E1;
        }

        .transfer-details-card {
            background: rgba(10, 15, 28, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 1.8rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.2px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #C7D2FE;
            border-left: 3px solid #F59E0B;
            padding-left: 0.8rem;
        }

        .requisites-block {
            background: #02061770;
            border-radius: 1.2rem;
            padding: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            border: 1px solid #334155;
        }

        .requisite-item {
            flex: 1;
            min-width: 140px;
        }

        .requisite-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #818CF8;
            letter-spacing: 1px;
        }

        .requisite-value {
            font-weight: 600;
            font-size: 0.85rem;
            color: #FDE68A;
            word-break: break-all;
            font-family: monospace;
        }

        /* Inputs futuristic */
        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            color: #9CA3AF;
            letter-spacing: 0.5px;
        }

        .currency-input {
            display: flex;
            align-items: center;
            background: #0F172A;
            border-radius: 1rem;
            border: 1px solid #334155;
            overflow: hidden;
            transition: 0.2s;
        }

        .currency-input:focus-within {
            border-color: #6366F1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
        }

        .currency-symbol {
            background: #1E293B;
            padding: 0.7rem 1rem;
            font-weight: 700;
            color: #A5B4FC;
        }

        .currency-input input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.7rem 1rem;
            color: #F1F5F9;
            font-size: 1rem;
            outline: none;
            font-weight: 500;
        }

        .result-box {
            background: #0F172A;
            border-radius: 1.2rem;
            padding: 1rem;
            margin: 1rem 0;
            border-left: 4px solid #F59E0B;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin: 0.3rem 0;
            font-size: 0.85rem;
        }

        .result-amount {
            font-size: 1.2rem;
            font-weight: 800;
            color: #FDE047;
        }

        .exchange-action-btn {
            background: linear-gradient(95deg, #4F46E5, #7C3AED);
            border: none;
            width: 100%;
            padding: 0.9rem;
            border-radius: 1.5rem;
            font-weight: 700;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
            box-shadow: 0 8px 14px -6px rgba(79, 70, 229, 0.4);
        }

        .exchange-action-btn:hover {
            background: linear-gradient(95deg, #6366F1, #8B5CF6);
            transform: scale(0.98);
        }

        .toast-message {
            text-align: center;
            margin-top: 1rem;
            padding: 0.6rem;
            border-radius: 2rem;
            background: #1E293B;
            font-size: 0.75rem;
            color: #CBD5E1;
            transition: 0.2s;
        }

        /* responsive */
        @media (max-width: 768px) {
            body { padding: 0.8rem; }
            .pairs-table { display: none; }
            .mobile-cards-container { display: flex; }
            .table-container { padding: 1rem; }
            .exchange-detail { padding: 1rem; }
            .pair-big { font-size: 1.6rem; }
            .requisites-block { flex-direction: column; }
            .nav-bar { padding: 0.8rem 1rem; }
        }

        @media (max-width: 480px) {
            .pair-big { font-size: 1.4rem; }
            .exchange-header { padding: 1rem; }
        }

        /* custom scroll */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0F172A;
        }
        ::-webkit-scrollbar-thumb {
            background: #4F46E5;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="nav-bar" id="navBar">
        <button class="back-btn" id="backButton" style="display: none;">←</button>
        <span class="page-title" id="pageTitle">⚡ EXCHANGE</span>
    </div>
    <div id="routerOutlet"></div>
</div>

<script>
    // ---------- MODERN TRADING PAIRS ----------
    const TRADING_PAIRS = [
        { id: 'btc_usdt', base: 'BTC', quote: 'USDT', baseName: 'Bitcoin', quoteName: 'Tether', rate: 68450.75, precision: 2, minAmount: 0.0005, icon: '₿', trend: '+2.4%' },
        { id: 'eth_usdt', base: 'ETH', quote: 'USDT', baseName: 'Ethereum', quoteName: 'Tether', rate: 3245.30, precision: 2, minAmount: 0.01, icon: 'Ξ', trend: '+1.2%' },
        { id: 'btc_rub', base: 'BTC', quote: 'RUB', baseName: 'Bitcoin', quoteName: 'Ruble', rate: 5985000, precision: 0, minAmount: 0.0005, icon: '₿', trend: '-0.3%' },
        { id: 'usd_rub', base: 'USD', quote: 'RUB', baseName: 'Dollar', quoteName: 'Ruble', rate: 92.85, precision: 2, minAmount: 5, icon: '$', trend: '+0.5%' },
        { id: 'eur_usd', base: 'EUR', quote: 'USD', baseName: 'Euro', quoteName: 'Dollar', rate: 1.0892, precision: 4, minAmount: 10, icon: '€', trend: '-0.1%' },
        { id: 'eth_btc', base: 'ETH', quote: 'BTC', baseName: 'Ethereum', quoteName: 'Bitcoin', rate: 0.04735, precision: 6, minAmount: 0.05, icon: 'Ξ', trend: '+0.8%' }
    ];

    let userBalance = {
        BTC: 0.085, ETH: 1.45, USDT: 3200, RUB: 125000, USD: 2100, EUR: 880
    };

    function getRequisitesForPair(base, quote) {
        const accounts = {
            BTC: 'bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh',
            ETH: '0x71C7656EC7ab88b098defB751B7401B5f6d8976F',
            USDT: 'TRC20: TQm9tFyV9zRjL6k3xWpE8nB5uH7jK2LmN',
            RUB: 'СБП 2202 **** 5678 (Иванов И.И.)',
            USD: 'SWIFT: CHASUS33 / Acc 00987654',
            EUR: 'IBAN: DE89 3704 0044 0532 0130 00'
        };
        if (accounts[base]) return `${accounts[base]} (${base})`;
        if (accounts[quote]) return `${accounts[quote]} (получатель)`;
        return `EXCHANGE-${base}${quote}-WALLET`;
    }

    // ------ Router via search params ------
    function getCurrentRoute() {
        const params = new URLSearchParams(window.location.search);
        const page = params.get('page');
        const pairId = params.get('pair');
        if (page === 'exchange' && pairId) {
            const found = TRADING_PAIRS.find(p => p.id === pairId);
            if (found) return { type: 'exchange', pair: found };
        }
        return { type: 'home' };
    }

    function updateUrlAndRender(pageType, pairId = null) {
        const url = new URL(window.location.href);
        if (pageType === 'exchange' && pairId) {
            url.searchParams.set('page', 'exchange');
            url.searchParams.set('pair', pairId);
        } else {
            url.searchParams.delete('page');
            url.searchParams.delete('pair');
        }
        window.history.pushState({}, '', url);
        handleRouting();
    }

    function handleRouting() {
        const route = getCurrentRoute();
        if (route.type === 'exchange') {
            renderExchangePage(route.pair);
            updateNavBar(true, `${route.pair.base}/${route.pair.quote}`);
        } else {
            renderMainPage();
            updateNavBar(false, 'Торговые пары');
        }
    }

    function updateNavBar(showBack, title) {
        const backBtn = document.getElementById('backButton');
        const titleSpan = document.getElementById('pageTitle');
        if (showBack) backBtn.style.display = 'flex';
        else backBtn.style.display = 'none';
        titleSpan.innerText = title;
    }

    // ---------- MAIN PAGE (DESKTOP TABLE + MOBILE CARDS) ----------
    function renderMainPage() {
        const outlet = document.getElementById('routerOutlet');
        let tableRows = '';
        let mobileCards = '';

        TRADING_PAIRS.forEach(pair => {
            const formattedRate = pair.rate.toLocaleString(undefined, { minimumFractionDigits: pair.precision, maximumFractionDigits: pair.precision });
            tableRows += `
                <tr data-pair-id="${pair.id}">
                    <td class="pair-symbol">${pair.base}/${pair.quote}</td>
                    <td>${pair.baseName} → ${pair.quoteName}</td>
                    <td><span class="rate-value">1 ${pair.base} = ${formattedRate} ${pair.quote}</span></td>
                    <td>${pair.minAmount} ${pair.base}</td>
                    <td><span class="badge-market">${pair.trend}</span></td>
                </tr>
            `;
            mobileCards += `
                <div class="mobile-pair-card" data-pair-id="${pair.id}">
                    <div class="mobile-card-header">
                        <div class="mobile-pair-symbol">${pair.base}/${pair.quote}</div>
                        <div class="mobile-rate-badge">${formattedRate} ${pair.quote}</div>
                    </div>
                    <div style="font-size:0.75rem; color:#94A3B8; margin-bottom: 0.25rem;">${pair.baseName} → ${pair.quoteName}</div>
                    <div style="display: flex; justify-content: space-between; margin-top: 0.5rem;">
                        <span>📉 мин. ${pair.minAmount} ${pair.base}</span>
                        <span class="badge-market">${pair.trend}</span>
                    </div>
                </div>
            `;
        });

        const balanceStr = `₿ ${userBalance.BTC.toFixed(5)}  Ξ ${userBalance.ETH.toFixed(4)}  💵 ${userBalance.USDT.toFixed(0)}  ₽ ${userBalance.RUB.toFixed(0)}  💶 ${userBalance.EUR.toFixed(2)}`;

        const html = `
            <div class="table-container">
                <table class="pairs-table">
                    <thead><tr><th>Пара</th><th>Название</th><th>Курс</th><th>Мин.</th><th>Тренд</th></tr></thead>
                    <tbody>${tableRows}</tbody>
                </table>
                <div class="mobile-cards-container">${mobileCards}</div>
                <div class="balance-footer">
                    💎 Демо-баланс • ${balanceStr}
                    <div style="font-size:0.65rem; margin-top: 0.3rem;">✨ Нажмите на любую пару для безопасного обмена</div>
                </div>
            </div>
        `;
        outlet.innerHTML = html;

        document.querySelectorAll('.pairs-table tbody tr, .mobile-pair-card').forEach(el => {
            el.addEventListener('click', (e) => {
                const pairId = el.getAttribute('data-pair-id');
                if (pairId) updateUrlAndRender('exchange', pairId);
            });
        });
    }

    // ---------- EXCHANGE PAGE (REQUISITES + TRANSFER) ----------
    function renderExchangePage(pair) {
        const outlet = document.getElementById('routerOutlet');
        const { base, quote, rate, precision, baseName, quoteName, minAmount, id } = pair;
        const requisites = getRequisitesForPair(base, quote);

        const html = `
            <div class="exchange-detail">
                <div class="exchange-header">
                    <div class="pair-big">${base}/${quote}</div>
                    <div class="live-rate">1 ${base} = ${rate.toFixed(precision)} ${quote}</div>
                </div>
                
                <div class="transfer-details-card">
                    <div class="section-title">📄 Реквизиты перевода</div>
                    <div class="requisites-block">
                        <div class="requisite-item">
                            <div class="requisite-label">Отправляете</div>
                            <div class="requisite-value">${base} (${baseName})</div>
                        </div>
                        <div class="requisite-item">
                            <div class="requisite-label">Получатель / Счет</div>
                            <div class="requisite-value">${requisites}</div>
                        </div>
                        <div class="requisite-item">
                            <div class="requisite-label">Назначение</div>
                            <div class="requisite-value">EXCHANGE ${id.toUpperCase()} | ${base}→${quote}</div>
                        </div>
                    </div>
                    <div style="font-size:0.7rem; background:#02061740; border-radius: 1rem; padding: 0.5rem; text-align: center;">
                        🔐 Средства зачисляются после подтверждения сети. Симуляция обмена ниже.
                    </div>
                </div>

                <div class="transfer-details-card">
                    <div class="section-title">💱 Сумма конвертации</div>
                    <div class="input-group">
                        <label>Вы переводите (${base})</label>
                        <div class="currency-input">
                            <span class="currency-symbol">${base}</span>
                            <input type="number" id="sendAmount" step="any" value="${minAmount}">
                        </div>
                        <div style="font-size:0.65rem; margin-top:0.2rem;">мин. ${minAmount} ${base}</div>
                    </div>
                    <div class="input-group">
                        <label>Получаете (${quote})</label>
                        <div class="currency-input">
                            <span class="currency-symbol">${quote}</span>
                            <input type="number" id="receiveAmount" disabled readonly>
                        </div>
                    </div>
                    <div class="result-box">
                        <div class="result-row"><span>🏦 Курс обмена</span><span>1 ${base} = ${rate.toFixed(precision)} ${quote}</span></div>
                        <div class="result-row"><span>💸 Вы получите</span><span class="result-amount" id="dynamicReceive">0.00 ${quote}</span></div>
                    </div>
                    <button class="exchange-action-btn" id="exchangeBtn">💳 Подтвердить перевод</button>
                    <div id="toastMsg" class="toast-message">✨ Введите сумму и проверьте реквизиты</div>
                    <div class="balance-note" style="margin-top: 1rem; font-size:0.7rem; text-align:center; background:#0A0F1A; padding:0.5rem; border-radius:1rem;">
                        💎 Ваш баланс: ${base}: ${userBalance[base]?.toFixed(base === 'BTC' ? 6 : 2) ?? '0'} | ${quote}: ${userBalance[quote]?.toFixed(quote === 'RUB' ? 0 : 2) ?? '0'}
                    </div>
                </div>
            </div>
        `;
        outlet.innerHTML = html;

        const sendInput = document.getElementById('sendAmount');
        const receiveSpan = document.getElementById('dynamicReceive');
        const receiveInput = document.getElementById('receiveAmount');
        const exchangeBtn = document.getElementById('exchangeBtn');
        const toast = document.getElementById('toastMsg');

        function updateReceive() {
            let val = parseFloat(sendInput.value);
            if (isNaN(val) || val < 0) val = 0;
            const converted = val * rate;
            receiveSpan.innerText = `${converted.toFixed(precision)} ${quote}`;
            if (receiveInput) receiveInput.value = converted.toFixed(precision);
        }

        sendInput.addEventListener('input', () => {
            updateReceive();
            let amount = parseFloat(sendInput.value);
            if (!isNaN(amount) && amount < minAmount && amount !== 0) {
                toast.innerHTML = `⚠️ Минимум: ${minAmount} ${base}`;
                toast.style.background = '#451A1A';
            } else {
                toast.innerHTML = `💸 Готово. Нажмите "Подтвердить перевод"`;
                toast.style.background = '#1E293B';
            }
        });

        sendInput.value = minAmount;
        updateReceive();

        exchangeBtn.addEventListener('click', () => {
            let amountBase = parseFloat(sendInput.value);
            if (isNaN(amountBase) || amountBase <= 0) {
                toast.innerHTML = '❌ Введите сумму больше 0';
                toast.style.background = '#450A0A';
                return;
            }
            if (amountBase < minAmount) {
                toast.innerHTML = `❌ Сумма ниже минимума (${minAmount} ${base})`;
                toast.style.background = '#450A0A';
                return;
            }
            const balanceBase = userBalance[base];
            if (!balanceBase || balanceBase < amountBase) {
                toast.innerHTML = `⛔ Недостаточно ${base}. Доступно: ${balanceBase?.toFixed(base === 'BTC' ? 6 : 2) || 0}`;
                toast.style.background = '#450A0A';
                return;
            }
            const receivedAmount = amountBase * rate;
            userBalance[base] = balanceBase - amountBase;
            if (userBalance[quote] !== undefined) userBalance[quote] += receivedAmount;
            else userBalance[quote] = receivedAmount;

            // update balance note
            const balanceNoteDiv = document.querySelector('.balance-note');
            if (balanceNoteDiv) {
                balanceNoteDiv.innerHTML = `💎 Баланс обновлен: ${base}: ${userBalance[base]?.toFixed(base === 'BTC' ? 6 : 2)} | ${quote}: ${userBalance[quote]?.toFixed(quote === 'RUB' ? 0 : 2)} ✅`;
            }
            toast.innerHTML = `✅ Успешно! Переведено ${amountBase.toFixed(base === 'BTC' ? 6 : 2)} ${base} → получено ${receivedAmount.toFixed(precision)} ${quote}. Реквизиты оплачены.`;
            toast.style.background = '#14532D';
            updateReceive();

            setTimeout(() => {
                if (toast.innerHTML.includes('Успешно')) {
                    toast.style.background = '#1E293B';
                    toast.innerHTML = '✨ Обмен выполнен. Можете продолжить.';
                }
            }, 2800);
        });
    }

    window.addEventListener('popstate', () => {
        handleRouting();
        setupNavEvents();
    });

    function setupNavEvents() {
        const backBtn = document.getElementById('backButton');
        if (backBtn) backBtn.onclick = () => updateUrlAndRender('home');
    }

    function init() {
        handleRouting();
        setupNavEvents();
    }
    init();
</script>
</body>
</html>
